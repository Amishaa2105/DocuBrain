name: docubrain

services:
  docubrain:
    build: .
    image: docubrain:local
    container_name: docubrain-compose
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DOCUBRAIN_DB_PATH: /data/docubrain.db
      DOCUBRAIN_LOG_FILE: /logs/docubrain.log
    ports:
      - "8000:8000"
    volumes:
      - document-data:/data
      - application-logs:/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: docubrain-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      docubrain:
        condition: service_healthy

  loki:
    image: grafana/loki:3.5.0
    container_name: docubrain-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.8.3
    container_name: docubrain-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - application-logs:/var/log/docubrain:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      docubrain:
        condition: service_healthy
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:11.5.2
    container_name: docubrain-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-docubrain-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/docubrain-dashboard.json:/var/lib/grafana/dashboards/docubrain-dashboard.json:ro
    depends_on:
      - prometheus
      - loki

volumes:
  document-data:
    name: docubrain-data
  application-logs:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
